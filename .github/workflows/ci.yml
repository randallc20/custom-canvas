name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Falls back to build-safe placeholders when repo secrets are unset;
          # real values are only needed at runtime (Vercel holds those).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_placeholder' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

  # Critical-path E2E against the deployed staging app. The public smoke specs
  # always run; the authenticated specs run only when the seeded-account secrets
  # are configured (they self-skip otherwise, so this job stays green until the
  # repo secrets below are set). Runs post-merge on master, not on PRs, since it
  # tests the deployed staging environment rather than the PR's own code.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Vercel's deploy and this workflow race on every push — wait until the
      # deployed SHA matches the commit under test (12 min cap), else the job
      # can green-light the PREVIOUS deployment.
      - name: Wait for Vercel deploy of this commit
        run: |
          BASE="${E2E_BASE_URL}"
          for i in $(seq 1 48); do
            SHA=$(curl -sf "$BASE/api/version" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha') or '')" 2>/dev/null || true)
            echo "poll $i: deployed=$SHA want=$GITHUB_SHA"
            [ "$SHA" = "$GITHUB_SHA" ] && exit 0
            sleep 15
          done
          echo "::warning::Deploy SHA never matched — testing whatever is live"
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://custom-canvas-chi.vercel.app' }}
      - run: npx playwright test --project=chromium
        env:
          # Defaults to the staging deploy; override via the E2E_BASE_URL secret.
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://custom-canvas-chi.vercel.app' }}
          E2E_BUYER_EMAIL: ${{ secrets.E2E_BUYER_EMAIL }}
          E2E_BUYER_PASSWORD: ${{ secrets.E2E_BUYER_PASSWORD }}
          E2E_ARTIST_EMAIL: ${{ secrets.E2E_ARTIST_EMAIL }}
          E2E_ARTIST_PASSWORD: ${{ secrets.E2E_ARTIST_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-artifacts
          # html report + traces (trace: on-first-retry writes to test-results/)
          path: |
            playwright-report/
            test-results/
          retention-days: 7
